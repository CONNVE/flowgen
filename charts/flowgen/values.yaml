################################################################################
# Global options
################################################################################
global:
  # Global image configuration
  image:
    repository: ghcr.io/connve/flowgen
    pullPolicy: IfNotPresent
    tag: "latest"

  # Global image pull secrets (optional)
  # Example:
  # imagePullSecrets:
  #   - name: regcred
  imagePullSecrets: []

################################################################################
# Flowgen options
################################################################################
flowgen:
  enabled: true

  nameOverride: ""
  fullnameOverride: ""

  # Number of replicas (used when autoscaling is disabled)
  replicaCount: 3

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  labels: {}

  podAnnotations: {}
    # Example: Enable Stakater Reloader for auto-restart on ConfigMap changes
    # Requires Stakater Reloader to be installed in the cluster
    # configmap.reloader.stakater.com/reload: "flows,config"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  # Termination grace period must be >= preStop sleep duration
  terminationGracePeriodSeconds: 45

  # Optional merge/patch hooks for the Deployment's pod template.
  # Use these to inject arbitrary pod spec fields (e.g. hostNetwork,
  # dnsPolicy, topologySpreadConstraints) without expanding the chart
  # surface for every possible option.
  #
  # Example:
  #   podTemplate:
  #     merge:
  #       hostNetwork: true
  #       dnsPolicy: ClusterFirstWithHostNet
  #     patch:
  #       - op: add
  #         path: /nodeSelector/kubernetes.io~1os
  #         value: linux
  podTemplate:
    merge: {}
    patch: []

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  http_server:
    type: ClusterIP
    port: 3000

  # MCP server service configuration (optional).
  # Only exposed when mcp_server is enabled in the worker config.
  # mcp_server:
  #   type: ClusterIP
  #   port: 3001

  # AI gateway service configuration (optional).
  # Only exposed when ai_gateway is enabled in the worker config.
  # ai_gateway:
  #   type: ClusterIP
  #   port: 3002

  # Admin web UI service configuration (optional).
  # Only exposed when web is enabled in the worker config.
  # web:
  #   type: ClusterIP
  #   port: 8080

  # Kubernetes liveness/readiness listener. Independent from the API
  # listeners so probes keep working regardless of which surfaces are
  # enabled. Endpoints: /livez (always 200), /readyz (200 once >=1 flow
  # is registered), /healthz (alias of /livez for pre-1.16 convention).
  health:
    port: 8081

    # Probe tuning. Set timeoutSeconds explicitly on all three: the
    # Kubernetes default is 1s, which restarts a worker that is merely busy.
    probes:
      # Covers slow starts, so the other two need no initialDelaySeconds.
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12
      # Sensitive: removing a pod from the load balancer is reversible.
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      # Slack: this restarts the pod. periodSeconds x failureThreshold is
      # how long a worker may be unresponsive first — 75s by default.
      liveness:
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  config:
    path: /etc/app/config.yaml
    # Reference existing ConfigMap created externally.
    # When set, this takes precedence over inline values.
    # Example: existingConfigMap: my-config
    existingConfigMap: ""
    # Inline config for pure Helm deployments without external ConfigMap management.
    # This value is only used when existingConfigMap is empty.
    # Example:
    #   inline: |
    #     flows:
    #       path: "/etc/app/flows"
    #     resources:
    #       path: "/etc/app/resources"
    #     telemetry:
    #       enabled: true
    #       backend:
    #         type: remote
    #         endpoint: "http://otel-collector:4317"
    #       service_name: "flowgen"
    #       metrics_export_interval: "60s"
    inline: ""

  # Environment variables passed to the container.
  # Also accessible in flow configs via {{env.VAR_NAME}}.
  #
  # Logging Configuration:
  # - RUST_LOG: Controls log verbosity (default: info)
  # - LOG_FORMAT: Override log format - "json" (structured) or "compact" (human-readable)
  #   Default behavior: Auto-detects TTY (terminal → compact, Docker/K8s → json)
  #
  # OpenTelemetry/OTLP Configuration:
  # Configure telemetry in the config.inline section above.
  # Exports metrics and distributed traces to OTLP-compatible collectors (Grafana, Datadog, etc.)
  # Default endpoint: http://localhost:4317
  # Default metrics interval: 60s
  #
  # Example:
  # - name: RUST_LOG
  #   value: "info,async_nats=warn,opentelemetry=warn,tiberius=warn"
  # - name: LOG_FORMAT
  #   value: "json"  # Force JSON logging (recommended for production)
  env: []

  # Flow and resource configuration management.
  # Supports three deployment methods for managing flow and resource files.
  # Method 1: External ConfigMaps created via kustomize, kubectl, or GitOps tools (recommended for production).
  # Method 2: Inline values embedded directly in values.yaml (suitable for testing or small configurations).
  # Method 3: GitOps auto-generation where ArgoCD or Flux generates ConfigMaps from git directories.
  flows:
    # Reference existing ConfigMaps created externally via kustomize, kubectl, or GitOps tools.
    # When set, this takes precedence over inline values.
    # Each ConfigMap should contain flow YAML files as keys with their complete content as values.
    #
    # Supports two formats:
    #
    # Simple array format - each ConfigMap mounts to an indexed path like /etc/app/flows/0:
    #   existingConfigMaps:
    #     - flows-mssql
    #     - flows-gcp
    #
    # Object format with custom paths - specify exact mount location for each ConfigMap:
    #   existingConfigMaps:
    #     - name: flows-mssql
    #       mountPath: /etc/app/flows/mssql
    #     - name: flows-gcp
    #       mountPath: /etc/app/flows/gcp
    existingConfigMaps: []

    # Inline flow definitions for pure Helm deployments without external ConfigMap management.
    # These values are only used when existingConfigMaps is empty.
    # Keys should represent the flow file path, and values should contain the complete YAML content.
    # Example:
    #   inline:
    #     category/flow1.yaml: |
    #       flow:
    #         name: flow1
    #         tasks:
    #           - generate:
    #               name: trigger
    inline: {}

  flowResources:
    # Reference existing ConfigMaps for resource files such as SQL queries or scripts.
    # When set, this takes precedence over inline values.
    # Each ConfigMap should contain resource files as keys with their complete content as values.
    #
    # Supports two formats:
    #
    # Simple array format - each ConfigMap mounts to an indexed path like /etc/app/resources/0:
    #   existingConfigMaps:
    #     - resources-sql
    #     - resources-scripts
    #
    # Object format with custom paths - specify exact mount location for each ConfigMap:
    #   existingConfigMaps:
    #     - name: resources-sql
    #       mountPath: /etc/app/resources/sql
    #     - name: resources-scripts
    #       mountPath: /etc/app/resources/scripts
    existingConfigMaps: []

    # Inline resource definitions for pure Helm deployments without external ConfigMap management.
    # These values are only used when existingConfigMaps is empty.
    # Keys should represent the resource filename, and values should contain the complete file content.
    # Example:
    #   inline:
    #     query1.sql: |
    #       SELECT * FROM table1
    inline: {}

  volumes:
    config:
      enabled: true
      configMapName: config
      mountPath: /etc/app
    flows:
      enabled: true
      mountPath: /etc/app/flows
    flowResources:
      enabled: true
      mountPath: /etc/app/resources
    # Secrets - user must configure these as needed.
    # Example:
    # natsCredentials:
    #   enabled: true
    #   secretName: "my-nats-secret"
    #   mountPath: /etc/nats
    # gcpCredentials:
    #   enabled: true
    #   secretName: "my-gcp-secret"
    #   mountPath: /etc/gcp

  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

################################################################################
# WireGuard VPN Gateway
# Standalone pod with socat port forwarding for accessing private networks.
# Flowgen pods connect to forwarded ports via the gateway's ClusterIP Service.
# Uses Recreate strategy since only one pod can hold a given VPN identity.
################################################################################
wireguardGateway:
  enabled: false

  image:
    repository: ghcr.io/linuxserver/wireguard
    tag: 1.0.20250521-r1-ls105
    pullPolicy: IfNotPresent

  # Each tunnel maps to a WireGuard config secret and a set of port forwards.
  # Example:
  #   tunnels:
  #     - name: wg0
  #       secretName: wireguard-client-a
  #       portForwards:
  #         - name: mssql
  #           port: 1433
  #           targetHost: 10.0.0.5
  #           targetPort: 1433
  #         - name: postgres
  #           port: 5432
  #           targetHost: 10.0.0.6
  #           targetPort: 5432
  #           servicePort: 15432    # optional: expose on a different port in the Service
  tunnels: []

  env:
    - name: LOG_CONFS
      value: "false"
    - name: WIREGUARD_IMPLEMENTATION
      value: "wireguard-go"

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    capabilities:
      add:
        - NET_ADMIN
    privileged: false

  socat:
    image: alpine/socat:1.8.0.1
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 10m
        memory: 16Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

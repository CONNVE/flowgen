[workspace]
members = ["flowgen/app", "flowgen/api/client", "charts/flowgen/tests"]
# `flowgen-chart-tests` shells out to the `helm` binary, which is not
# available in every environment. Excluding it from default-members means
# `cargo test` at the root only touches the main app; the helm-chart tests
# still run explicitly via `cargo test -p flowgen-chart-tests` in their
# dedicated CI job.
default-members = ["flowgen/app"]
resolver = "2"
exclude = [".cargo"]

[workspace.lints.clippy]
# Ban `#[allow(clippy::...)]` and `#[allow(...)]` attributes outright.
# Warnings flag real modelling problems; the rule across this codebase is
# to fix the underlying code rather than silence the lint. Anything that
# genuinely needs to suppress a lint should use `#[expect(...)]` with a
# reason instead, which surfaces dead suppressions when the lint stops
# firing.
allow_attributes = "deny"

[workspace.package]
version = "0.135.0"
authors = ["CONNVE"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
salesforce_core = { version = "0.17.0" }
google-cloud-bigquery = { package = "gcloud-bigquery", git = "https://github.com/connve/google-cloud-rust" }
gcloud-auth = { git = "https://github.com/connve/google-cloud-rust" }
gcloud-gax = { git = "https://github.com/connve/google-cloud-rust" }
gcloud-googleapis = { git = "https://github.com/connve/google-cloud-rust" }
google-cloud-gax = { version = "0.21" }
object_store = { version = "0.14", default-features = false, features = [
    "aws",
    "gcp",
    "fs",
] }
bytes = { version = "1.11.1" }
handlebars = { version = "6.3" }
arrow = { version = "58.3", features = ["chrono-tz"] }
arrow-schema = { version = "58.3", features = ["serde"] }
arrow-json = { version = "58.3" }
parquet = { version = "58.3" }
chrono = { version = "0.4" }
clap = { version = "4", features = ["derive", "env"] }
chrono-tz = { version = "0.10" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
progenitor = { version = "0.13" }
progenitor-client = { version = "0.13" }
openapiv3 = { version = "2.2", default-features = false }
flowgen_client = { path = "flowgen/api/client" }
tokio = { version = "1.48", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
thiserror = { version = "1.0" }
tiberius = { version = "0.12", features = ["chrono"] }
futures-util = { version = "0.3" }
futures = { version = "0.3" }
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "form",
    "query",
    "rustls",
    "gzip",
    "brotli",
    "deflate",
    "charset",
    "stream",
] }
url = { version = "2.5" }
# gitoxide — pure-Rust git implementation. HTTPS transport via reqwest with
# rustls reuses the existing reqwest dep for a unified TLS stack. SSH
# support is intentionally not enabled: gix relies on shelling out to the
# `ssh` binary for SSH today, which defeats the single-binary goal.
gix = { version = "0.83", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "sha1",
    "max-performance-safe",
] }
# Pure-Rust OCI registry client. Uses rustls under the hood, no shelling
# out to `oras` or `docker`. Powers the `oci_sync` task that pulls flow
# artifacts from container registries (GHCR, ECR, GAR, Artifactory etc).
oci-client = { version = "0.17", default-features = false, features = [
    "rustls-tls",
] }
flate2 = { version = "1.0", default-features = false, features = [
    "rust_backend",
] }
tar = { version = "0.4", default-features = false }
braze = { version = "0.1.0" }
# Security fix: Using PR branch until 0.47 is released (RUSTSEC-2026-0049)
# https://github.com/nats-io/nats.rs/pull/1550
async-nats = { git = "https://github.com/nats-io/nats.rs", rev = "7e6672c240a4a1bd7726d37ac7b52a290af6b690" }
bincode = { version = "1.3" }
tonic = { version = "0.14", features = ["tls-native-roots"] }
config = { version = "0.15" }
serde_avro_fast = { version = "2.0" }
oauth2 = { version = "5.0" }
prost = { version = "0.13" }
prost-types = { version = "0.14" }
glob = { version = "0.3" }
apache-avro = { version = "0.19" }
regex = { version = "1.12" }
uuid = { version = "1", features = ["v7"] }
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private", "cookie-key-expansion"] }
time = { version = "0.3" }
base64 = { version = "0.22" }
http = { version = "1.4" }
bb8 = { version = "0.9" }
bb8-tiberius = { version = "0.16" }
async-trait = { version = "0.1" }
rhai = { version = "1.20", features = ["sync", "serde"] }
tokio-retry = { package = "tokio-retry2", version = "0.6", features = [
    "jitter",
] }
sha2 = { version = "0.10" }
humantime = { version = "2.1" }
humantime-serde = { version = "1.1" }
croner = { version = "3.0.1" }
dashmap = { version = "6.1" }
tower = { version = "0.5", features = ["util"] }
# Pinned to avoid 0.2.17 which has a non-exhaustive match compile error on recent Rust toolchains.
native-tls = { version = "=0.2.16" }
opentelemetry = { version = "0.27" }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"] }
tracing-opentelemetry = { version = "0.28" }
atty = { version = "0.2" }
rustls = { version = "0.23", features = ["ring"] }
tempfile = { version = "3.8" }
rig-core = { version = "0.35", features = ["rmcp"] }
rig-vertexai = { version = "0.3" }
rmcp = { version = "1", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
schemars = { version = "1.2" }
scraper = { version = "0.21" }
jsonwebtoken = { version = "9" }
secrecy = { version = "0.10", features = ["serde"] }
walkdir = { version = "2.5" }
testcontainers = { version = "0.27" }
rust-embed = { version = "8.7" }
mime_guess = { version = "2.0" }
bson = { version = "2.15" }
mongodb = { version = "3.8" }
